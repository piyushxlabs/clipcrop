[project]
name = "clipcrop"
version = "0.1.0"
description = "Local, deterministic, zero-cost video re-framing engine converting talking-head video into 9:16 vertical clips with smooth camera motion."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-multipart>=0.0.12",
    "mediapipe>=0.10.14",
    "faster-whisper>=1.0.3",
    "torch>=2.2.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0,<2.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
